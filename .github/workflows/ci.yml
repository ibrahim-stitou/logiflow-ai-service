name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  docker-build:
    name: Construction (et publication sur main) de l'image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publiée uniquement sur push vers main : consommée par logiflow-infra
      # (ansible/roles/ai) pour déployer le service IA sans avoir à builder sur la cible.
      - name: Construire (et publier) l'image du service IA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-ai-service:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
