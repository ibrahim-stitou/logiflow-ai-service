name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Base PostgreSQL + pgvector pour les tests des repositories SQL (tests/test_persistence_sql.py).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: logiflow_ai_test
          POSTGRES_USER: logiflow_ai
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logiflow_ai -d logiflow_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://logiflow_ai:test@localhost:5432/logiflow_ai_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  docker-build:
    name: Construction, analyse (Trivy) et publication de l'image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Se connecter à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image du service IA
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: logiflow-ai-service:analyse
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analysée AVANT publication : une CVE CRITIQUE corrigeable bloque la publication.
      - name: Analyser l'image (Trivy, bloquant sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logiflow-ai-service:analyse
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publiée uniquement sur push vers main : consommée par logiflow-infra. SBOM et
      # provenance (SLSA) attachés à l'image.
      - name: Publier l'image du service IA
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-ai-service:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-ai-service:${{ github.sha }}
          cache-from: type=gha
