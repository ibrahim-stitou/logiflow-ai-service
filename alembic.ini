# Migrations de la base propre au service IA (logiflow_ai). L'URL de connexion n'est PAS ici :
# elle vient de DATABASE_URL (Settings), voir migrations/env.py. Lancer : `make migrate`.
[alembic]
script_location = migrations
version_locations = migrations/versions
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
