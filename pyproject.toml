[project]
name = "logiflow-ai-service"
version = "0.1.0"
description = "LogiFlow TMS — service d'agents IA (copilote, groupage, maintenance, itinéraire), appelé exclusivement en interne par le backend Spring Boot."
authors = [
    { name = "ibrahim stitou", email = "149367384+ibrahim-stitou@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
